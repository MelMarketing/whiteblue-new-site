<section class="pitch" aria-labelledby="pitch-title">
  <div class="pitch__layout wb-container">
    <div class="pitch__copy">
      <wb-pill-label wbReveal icon="how-we-work" class="pitch__eyebrow">How we work</wb-pill-label>
      <h2 wbReveal class="wb-h2" id="pitch-title"><span class="wb-accent">Every pitch</span><br />plays differently</h2>
      <p wbReveal [wbRevealDelay]="120" class="wb-lead pitch__lead">
        Legacy cores, siloed data, manual work, regulation, pressure to scale. Every business faces a different mix, so we study yours before we recommend a single tool.
      </p>
      <wb-button wbReveal [wbRevealDelay]="240" class="pitch__cta" href="#case-studies">See how we work</wb-button>
    </div>

    <div
      wbReveal="fade"
      class="pitch__media"
      role="img"
      aria-label="A cricket pitch marked with the challenges every business faces: legacy core, siloed data, manual work, regulation and scale">
      <div class="pitch__frame">
        <video
          #video
          class="pitch__video"
          width="1440"
          height="1120"
          muted
          playsinline
          preload="auto"
          disablepictureinpicture
          aria-hidden="true"
          poster="assets/illustrations/pitch-start.webp">
          <source src="assets/illustrations/pitch.webm" type="video/webm" />
          <source src="assets/illustrations/pitch.mp4" type="video/mp4" />
        </video>

        <!-- Field markings. Coordinates are video pixels; the SVG box is 1.8× the video so lines can
             run past its edges towards the copy. The ground-plane transform maps a circle onto the
             same perspective as the pitch (axes measured from the stumps and creases). -->
        <svg class="pitch__field" viewBox="-576 -448 2592 2016" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <filter id="pitch-field-feather" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="34" />
            </filter>
            <!-- Subtle mowing bands, clipped to the grass between the 30-yard circle and boundary. -->
            <!-- The outer boundary stays visible on its upper and lower arcs, then fades
                 on the left-hand side as it passes behind the copy. -->
            <linearGradient id="pitch-boundary-fade" x1="0%" y1="50%" x2="100%" y2="50%">
              <stop offset="0%" stop-color="#2c58f1" stop-opacity="0.02" />
              <stop offset="18%" stop-color="#2c58f1" stop-opacity="0.08" />
              <stop offset="38%" stop-color="#2c58f1" stop-opacity="0.42" />
              <stop offset="100%" stop-color="#2c58f1" stop-opacity="0.42" />
            </linearGradient>
            <pattern id="pitch-grass-stripes" width="128" height="128" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
              <rect width="64" height="128" fill="#2c58f1" fill-opacity="0.035" />
            </pattern>
            <mask id="pitch-grass-annulus" maskUnits="userSpaceOnUse" x="-1300" y="-1300" width="2600" height="2600">
              <rect x="-1300" y="-1300" width="2600" height="2600" fill="#000" />
              <circle cx="16" cy="78" r="1040" fill="#fff" />
              <circle cx="16" cy="78" r="650" fill="#000" />
            </mask>
            <!-- Keeps the ground markings off the pitch strip and its labels. -->
            <mask id="pitch-field-mask" maskUnits="userSpaceOnUse" x="-576" y="-448" width="2592" height="2016">
              <rect x="-576" y="-448" width="2592" height="2016" fill="#fff" />
              <polygon points="427.9,215.4 1072.5,1106.5 1376.2,886.7 731.6,-4.3" fill="#000" filter="url(#pitch-field-feather)" />
            </mask>
          </defs>

          <g mask="url(#pitch-field-mask)">
            <g transform="matrix(0.586 0.810 0.939 -0.343 869 612)">
              <!-- Alternating, very subtle grass-cutting stripes in the outer field. -->
              <rect class="pitch__grass" x="-1000" y="-1000" width="2000" height="2130"
                    fill="url(#pitch-grass-stripes)" mask="url(#pitch-grass-annulus)" />
              <!-- The solid inner circle marks the 30-yard fielding circle. -->
              <circle class="pitch__mark pitch__mark--30-yard" cx="16" cy="78" r="650"
                      pathLength="1" vector-effect="non-scaling-stroke" />
              <!-- A lighter dotted circle represents the outer boundary. -->
              <circle class="pitch__mark pitch__mark--boundary" cx="16" cy="78" r="1120"
                      pathLength="1" vector-effect="non-scaling-stroke" />
            </g>
            <!-- Popping and bowling creases, extended across the field towards the copy -->
            <line class="pitch__mark pitch__mark--crease" x1="775" y1="362" x2="40" y2="630" pathLength="1"
                  vector-effect="non-scaling-stroke" style="transition-delay: 300ms" />
            <line class="pitch__mark pitch__mark--crease" x1="1137" y1="872" x2="250" y2="1196" pathLength="1"
                  vector-effect="non-scaling-stroke" style="transition-delay: 420ms" />
          </g>
        </svg>
      </div>
    </div>
  </div>
</section>
